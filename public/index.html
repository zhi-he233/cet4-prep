<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="翻译练习">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>四级翻译练习</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/app-icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="modal-overlay" id="authModal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="authModalTitle">登录</h2>
        <button type="button" class="icon-btn" id="closeAuthModalBtn" aria-label="关闭">×</button>
      </div>
      <p class="auth-hint">登录后，翻译记录会保存到本机服务端，换浏览器也能继续复习。</p>
      <div id="authMessage" class="auth-message"></div>
      <label class="input-label" for="authUsername">用户名</label>
      <input id="authUsername" class="search-input" type="text" autocomplete="username" maxlength="20">
      <label class="input-label" for="authPassword">密码</label>
      <input id="authPassword" class="search-input" type="password" autocomplete="current-password" maxlength="50">
      <div id="inviteCodeRow" style="display:none;">
        <label class="input-label" for="inviteCodeInput">邀请码</label>
        <input id="inviteCodeInput" class="search-input" type="text" autocomplete="off" maxlength="20" placeholder="注册时填写">
      </div>
      <div class="auth-actions">
        <button id="authSubmitBtn" type="button" class="btn-primary">登录</button>
        <button id="authSwitchBtn" type="button" class="btn-secondary">去注册</button>
      </div>
    </div>
  </div>

  <div class="container">
    <header class="app-header">
      <h1 data-exam-title>四级翻译练习</h1>
      <div class="toolbar">
        <span id="authStatus" class="auth-status">未登录，本机保存</span>
        <button id="loginBtn" type="button" class="btn-secondary">登录</button>
        <button id="logoutBtn" type="button" class="btn-secondary" style="display:none;">退出</button>
        <label for="examLevelSelect">备考级别</label>
        <select id="examLevelSelect">
          <option value="cet4">四级 CET-4</option>
          <option value="cet6">六级 CET-6</option>
        </select>
        <button id="themeToggleBtn" type="button" class="btn-secondary">深色模式</button>
      </div>
    </header>

    <nav class="tabs" aria-label="功能切换">
      <button class="tab-btn active" type="button" data-tab="translate">翻译练习</button>
      <button class="tab-btn" type="button" data-tab="history">翻译记录</button>
    </nav>

    <main>
      <section id="tab-translate" class="tab-content active">
        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow" data-exam-label>四级</p>
              <h2>句子翻译评分</h2>
            </div>
            <button id="refreshSentenceBtn" type="button" class="btn-secondary">换一题</button>
          </div>

          <div class="prompt-box">
            <span class="label">中文原句</span>
            <div id="chineseDisplay" class="chinese-sentence">加载中...</div>
          </div>

          <label class="input-label" for="translationInput">你的英文翻译</label>
          <textarea id="translationInput" rows="5" placeholder="输入你的英文翻译..."></textarea>

          <div class="actions">
            <button id="evaluateTranslationBtn" type="button" class="btn-primary">AI 评分及建议</button>
          </div>

          <div id="translateResult" class="result-box" aria-live="polite"></div>
          <div id="translateReviewPanel" class="review-panel" style="display:none;"></div>
        </div>
      </section>

      <section id="tab-history" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">复习</p>
              <h2>翻译记录</h2>
            </div>
            <button id="clearHistoryBtn" type="button" class="btn-secondary">清空记录</button>
          </div>
          <input type="text" id="historySearch" class="search-input" placeholder="搜索中文或英文...">
          <ul id="historyList" class="history-list"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/history.js"></script>
  <script src="js/translate.js"></script>
  <script>
    initAppShell();
    initAuth();

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((item) => item.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach((item) => item.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab)?.classList.add('active');
        if (btn.dataset.tab === 'history') showTranslateHistory();
      });
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
