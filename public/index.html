<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>四级翻译练习</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1 data-exam-title>四级翻译练习</h1>
      <div class="toolbar">
        <label for="examLevelSelect">备考级别</label>
        <select id="examLevelSelect">
          <option value="cet4">四级 CET-4</option>
          <option value="cet6">六级 CET-6</option>
        </select>
        <button id="themeToggleBtn" type="button" class="btn-secondary">深色模式</button>
      </div>
    </header>

    <nav class="tabs" aria-label="功能切换">
      <button class="tab-btn active" type="button" data-tab="translate">翻译练习</button>
      <button class="tab-btn" type="button" data-tab="history">翻译记录</button>
    </nav>

    <main>
      <section id="tab-translate" class="tab-content active">
        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow" data-exam-label>四级</p>
              <h2>句子翻译评分</h2>
            </div>
            <button id="refreshSentenceBtn" type="button" class="btn-secondary">换一题</button>
          </div>

          <div class="prompt-box">
            <span class="label">中文原句</span>
            <div id="chineseDisplay" class="chinese-sentence">加载中...</div>
          </div>

          <label class="input-label" for="translationInput">你的英文翻译</label>
          <textarea id="translationInput" rows="5" placeholder="输入你的英文翻译..."></textarea>

          <div class="actions">
            <button id="evaluateTranslationBtn" type="button" class="btn-primary">AI 评分及建议</button>
          </div>

          <div id="translateResult" class="result-box" aria-live="polite"></div>
          <div id="translateReviewPanel" class="review-panel" style="display:none;"></div>
        </div>
      </section>

      <section id="tab-history" class="tab-content">
        <div class="panel">
          <div class="panel-header">
            <div>
              <p class="eyebrow">复习</p>
              <h2>翻译记录</h2>
            </div>
            <button id="clearHistoryBtn" type="button" class="btn-secondary">清空记录</button>
          </div>
          <input type="text" id="historySearch" class="search-input" placeholder="搜索中文或英文...">
          <ul id="historyList" class="history-list"></ul>
        </div>
      </section>
    </main>
  </div>

  <script src="lib/marked.min.js" defer></script>
  <script src="js/api.js"></script>
  <script src="js/history.js"></script>
  <script src="js/translate.js"></script>
  <script>
    initAppShell();

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((item) => item.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach((item) => item.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab)?.classList.add('active');
        if (btn.dataset.tab === 'history') showTranslateHistory();
      });
    });
  </script>
</body>
</html>
